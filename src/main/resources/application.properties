# =====================================================
# Aplicação
# =====================================================
spring.application.name=patinhas
server.port=8080
server.servlet.context-path=/

# =====================================================
# DataSource - PostgreSQL
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/patinhas
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =====================================================
# Thymeleaf
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =====================================================
# Upload de arquivos
# =====================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# Logs
# =====================================================
logging.level.root=INFO
logging.level.br.com.patinhas=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# =====================================================
# Mensagens
# =====================================================
spring.messages.encoding=UTF-8

# =====================================================
# Configurações do Admin Inicial (DataSeeder)
# =====================================================
patinhas.admin.email=admin@patinhas.org
patinhas.admin.senha=${ADMIN_SENHA_INICIAL}
patinhas.admin.nome=Administrador Patinhas

# =====================================================
# Upload de imagens (pasta local do projeto)
# =====================================================
patinhas.upload.dir=images
