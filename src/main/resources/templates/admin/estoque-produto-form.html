<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(tituloPagina=${modoEdicao ? 'Editar produto' : 'Novo produto'}, cssExtra=${ {'/css/dashboard.css'} }, conteudo=~{::section})}">
<body>
<section>
    <section class="container secao admin admin--centro">
        <a class="link-voltar link-voltar--admin" th:href="@{/admin/estoque/produtos}">← Voltar aos produtos</a>
        <h1 th:text="${modoEdicao ? 'Editar produto' : 'Novo produto'}">Novo produto</h1>
        <nav th:replace="~{fragments/estoque-nav :: menu}"></nav>


        <form class="formulario formulario--admin"
              th:action="${modoEdicao ? '/admin/estoque/produtos/' + produtoId : '/admin/estoque/produtos'}"
              th:object="${produto}" method="post">

            <div class="alerta alerta--erro" th:if="${erroNegocio}" th:text="${erroNegocio}"></div>
            <div class="alerta alerta--erro" th:if="${#fields.hasErrors('*')}">
                <strong>Confira os campos antes de salvar.</strong>
            </div>

            <div class="campo">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" th:field="*{nome}" maxlength="150" placeholder="Ex.: Ração para cães" />
                <small class="campo__erro" th:errors="*{nome}"></small>
            </div>

            <div class="grid-2">
                <div class="campo">
                    <label for="categoriaId">Categoria *</label>
                    <select id="categoriaId" th:field="*{categoriaId}">
                        <option value="">Selecione...</option>
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nome}"></option>
                    </select>
                    <small class="campo__erro" th:errors="*{categoriaId}"></small>
                </div>

                <div class="campo">
                    <label for="unidadeId">Unidade *</label>
                    <select id="unidadeId" th:field="*{unidadeId}">
                        <option value="">Selecione...</option>
                        <option th:each="unidade : ${unidades}"
                                th:value="${unidade.id}"
                                th:text="${unidade.nome}"></option>
                    </select>
                    <small class="campo__erro" th:errors="*{unidadeId}"></small>
                </div>
            </div>

            <div class="grid-2">
                <div class="campo">
                    <label for="estoqueMinimo">Estoque mínimo *</label>
                    <input type="number" id="estoqueMinimo" th:field="*{estoqueMinimo}" min="0" step="0.001" placeholder="0" />
                    <small class="campo__erro" th:errors="*{estoqueMinimo}"></small>
                </div>

                <div class="campo">
                    <label for="estoqueMaximo">Estoque máximo *</label>
                    <input type="number" id="estoqueMaximo" th:field="*{estoqueMaximo}" min="0" step="0.001" placeholder="0" />
                    <small class="campo__erro" th:errors="*{estoqueMaximo}"></small>
                </div>
            </div>

            <div class="campo" th:if="${!modoEdicao}">
                <label for="quantidadeInicial">Quantidade inicial</label>
                <input type="number" id="quantidadeInicial" th:field="*{quantidadeInicial}" min="0" step="0.001" placeholder="Vazio = saldo 0" />
                <small>Opcional. Se preencher, vira a primeira entrada, com a data de hoje e o seu usuário. Se deixar vazio, o saldo começa em 0.</small>
                <small class="campo__erro" th:errors="*{quantidadeInicial}"></small>
            </div>

            <div class="estoque-atual-form" th:if="${modoEdicao}">
                <span class="estoque-atual-form__rotulo">Saldo (entradas − saídas)</span>
                <strong th:text="${#numbers.formatDecimal(estoqueAtual, 1, 3)}">0,000</strong>
                <small>Somente leitura. Para mudar, use <a th:href="@{/admin/estoque/movimentacoes/nova(produtoId=${produtoId})}">Movimentar</a>.</small>
            </div>

            <div class="form-acoes">
                <a class="btn btn--texto" th:href="@{/admin/estoque/produtos}">Cancelar</a>
                <button type="submit" class="btn btn--primario">Salvar</button>
            </div>
        </form>
    </section>
</section>
</body>
</html>
