<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(tituloPagina=${modoEdicao ? 'Editar unidade' : 'Nova unidade'}, cssExtra=${ {'/css/dashboard.css'} }, conteudo=~{::section})}">
<body>
<section>
    <section class="container secao admin admin--centro">
        <a class="link-voltar link-voltar--admin" th:href="@{/admin/estoque/unidades}">← Voltar às unidades</a>
        <h1 th:text="${modoEdicao ? 'Editar unidade' : 'Nova unidade'}">Nova unidade</h1>
        <nav class="estoque-menu" aria-label="Navegação do estoque">
            <a th:href="@{/admin/estoque}">Visão geral</a>
            <a th:href="@{/admin/estoque/produtos}">Produtos</a>
            <a th:href="@{/admin/estoque/categorias}">Categorias</a>
            <a th:href="@{/admin/estoque/unidades}">Unidades</a>
            <a th:href="@{/admin/estoque/entrada}">Registrar entrada</a>
        </nav>


        <form class="formulario formulario--admin"
              th:action="${modoEdicao ? '/admin/estoque/unidades/' + unidadeId : '/admin/estoque/unidades'}"
              th:object="${unidade}" method="post">
            <div class="alerta alerta--erro" th:if="${erroNegocio}" th:text="${erroNegocio}"></div>
            <div class="alerta alerta--erro" th:if="${#fields.hasErrors('*')}">
                Confira os campos antes de salvar.
            </div>

            <div class="campo">
                <label for="nome">Unidade *</label>
                <input type="text" id="nome" th:field="*{nome}" maxlength="20" placeholder="Ex.: kg" />
                <small class="campo__erro" th:errors="*{nome}"></small>
            </div>

            <div class="form-acoes">
                <a class="btn btn--texto" th:href="@{/admin/estoque/unidades}">Cancelar</a>
                <button type="submit" class="btn btn--primario">Salvar</button>
            </div>
        </form>
    </section>
</section>
</body>
</html>
