<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(tituloPagina=${modoEdicao ? 'Editar evento' : 'Novo evento'}, cssExtra=${ {'/css/dashboard.css'} }, conteudo=~{::section})}">
<body>
<section>
    <section class="container secao admin admin--centro">
        <nav class="admin-breadcrumb" aria-label="Navegação">
            <a th:href="@{/admin/dashboard}">Painel</a>
            <span class="admin-breadcrumb__sep">/</span>
            <a th:href="@{/admin/eventos}">← Voltar aos eventos</a>
        </nav>

        <h1 th:text="${modoEdicao ? 'Editar evento' : 'Novo evento'}">Novo evento</h1>

        <form class="formulario formulario--admin"
              th:action="${modoEdicao ? '/admin/eventos/' + eventoId : '/admin/eventos'}"
              th:object="${evento}" method="post" enctype="multipart/form-data">

            <div class="campo">
                <label for="titulo">Título *</label>
                <input type="text" id="titulo" th:field="*{titulo}" />
                <small class="campo__erro" th:errors="*{titulo}"></small>
            </div>

            <div class="campo">
                <label for="descricao">Descrição *</label>
                <textarea id="descricao" th:field="*{descricao}" rows="4"></textarea>
                <small class="campo__erro" th:errors="*{descricao}"></small>
            </div>

            <div class="grid-2">
                <div class="campo">
                    <label for="local">Local *</label>
                    <input type="text" id="local" th:field="*{local}" />
                    <small class="campo__erro" th:errors="*{local}"></small>
                </div>

                <div class="campo">
                    <label for="dataEvento">Data e hora *</label>
                    <input type="datetime-local" id="dataEvento" th:field="*{dataEvento}" />
                    <small class="campo__erro" th:errors="*{dataEvento}"></small>
                </div>
            </div>

            <label class="switch-campo">
                <input type="checkbox" th:field="*{ativo}" />
                <span>Evento ativo (visível no site)</span>
            </label>

            <div class="campo campo-imagem">
                <label for="imagem">Imagem do evento</label>

                <div class="imagem-atual" th:if="${modoEdicao and !#strings.isEmpty(fotoAtual)}">
                    <img th:src="${fotoAtual}" alt="Imagem atual do evento" class="imagem-atual__preview"/>
                    <div class="imagem-atual__acoes">
                        <a class="btn btn--pequeno"
                           th:href="@{|/admin/eventos/${eventoId}/imagem/download|}">
                            Baixar imagem
                        </a>
                        <label class="switch-campo">
                            <input type="checkbox" name="removerImagem" value="true"/>
                            <span>Remover imagem atual</span>
                        </label>
                    </div>
                </div>

                <input type="file" id="imagem" name="imagem" accept="image/jpeg,image/png,image/webp,image/gif"/>
                <small class="texto-apoio">JPG, PNG, WEBP ou GIF — até 5 MB.</small>
                <small class="campo__erro" th:if="${erroImagem}" th:text="${erroImagem}"></small>
            </div>

            <div class="form-acoes">
                <a class="btn btn--texto" th:href="@{/admin/eventos}">Cancelar</a>
                <button type="submit" class="btn btn--primario"
                        th:text="${modoEdicao ? 'Salvar alterações' : 'Criar evento'}">Criar evento</button>
            </div>
        </form>
    </section>
</section>
</body>
</html>
