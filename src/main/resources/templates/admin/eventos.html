<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(tituloPagina='Gerenciar eventos', cssExtra=${ {'/css/dashboard.css'} }, conteudo=~{::section})}">
<body>
<section>
    <section class="container secao admin">
        <header class="admin__header admin__header--linha">
            <div>
                <h1>Eventos</h1>
                <p class="texto-apoio">Gerencie eventos e campanhas da ONG.</p>
            </div>
            <a class="btn btn--primario" th:href="@{/admin/eventos/novo}">+ Novo evento</a>
        </header>

        <div class="alerta alerta--sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>

        <div class="tabela-wrapper">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th>Ativo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="evento : ${eventos}">
                        <td th:text="${evento.id}">1</td>
                        <td th:text="${evento.titulo}">Título</td>
                        <td th:text="${evento.local}">Local</td>
                        <td th:text="${#temporals.format(evento.dataEvento, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                        <td th:text="${evento.ativo ? 'Sim' : 'Não'}">Sim</td>
                        <td class="acoes">
                            <a class="btn btn--pequeno" th:href="@{|/admin/eventos/${evento.id}/editar|}">Editar</a>
                            <form th:action="@{|/admin/eventos/${evento.id}/remover|}" method="post"
                                  th:if="${evento.ativo}"
                                  onsubmit="return confirm('Remover este evento?');">
                                <button type="submit" class="btn btn--pequeno btn--perigo">Remover</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(eventos)}">
                        <td colspan="6" class="vazio">Nenhum evento cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
</body>
</html>
