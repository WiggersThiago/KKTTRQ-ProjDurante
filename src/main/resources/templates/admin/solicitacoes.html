<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(tituloPagina='Solicitações', cssExtra=${ {'/css/dashboard.css'} }, conteudo=~{::section})}">
<body>
<section>
    <section class="container secao admin">
        <div th:replace="~{fragments/admin-nav :: voltarPainel}"></div>
        <header class="admin__header">
            <h1>Solicitações de adoção</h1>
            <p class="texto-apoio">Acompanhe quem quer adotar e atualize o status de cada pedido.</p>
        </header>

        <form class="filtros" th:action="@{/admin/solicitacoes}" method="get">
            <div class="filtros__campo">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="">Todos</option>
                    <option th:each="s : ${statusList}"
                            th:value="${s.name()}"
                            th:text="${s.descricao}"
                            th:selected="${statusFiltro != null and statusFiltro.name() == s.name()}"></option>
                </select>
            </div>
            <button class="btn btn--primario" type="submit">Filtrar</button>
        </form>

        <div class="tabela-wrapper">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Interessado</th>
                        <th>Animal</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="solicitacao : ${solicitacoes}">
                        <td th:text="${solicitacao.id}">1</td>
                        <td th:text="${solicitacao.nome}">Nome</td>
                        <td th:text="${solicitacao.animalNome}">Animal</td>
                        <td th:text="${#temporals.format(solicitacao.dataSolicitacao, 'dd/MM/yyyy HH:mm')}">—</td>
                        <td>
                            <span class="badge"
                                  th:classappend="'badge--status-' + ${#strings.toLowerCase(solicitacao.status.name())}"
                                  th:text="${solicitacao.status.descricao}">Nova</span>
                        </td>
                        <td>
                            <a class="btn btn--pequeno"
                               th:href="@{/admin/solicitacoes/{id}(id=${solicitacao.id})}">Ver detalhes</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(solicitacoes)}">
                        <td colspan="6" class="vazio">Nenhuma solicitação de adoção encontrada.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
</body>
</html>
