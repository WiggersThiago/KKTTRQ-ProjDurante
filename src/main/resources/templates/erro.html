<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(tituloPagina='Algo deu errado', conteudo=~{::section})}">
<body>
<section>
    <section class="container secao secao--centralizada">
        <div class="card-erro">
            <img th:replace="~{fragments/brand :: trayicon('marca-trayicon marca-trayicon--erro')}" />
            <h1>Ops!</h1>
            <p th:if="${codigo == '403'}">Você não tem permissão para acessar esta página.</p>
            <p th:if="${codigo != '403'}">Algo deu errado. Tente novamente mais tarde.</p>
            <a class="btn btn--primario" th:href="@{/}">Voltar para o início</a>
        </div>
    </section>
</section>
</body>
</html>
